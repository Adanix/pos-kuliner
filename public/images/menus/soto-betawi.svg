    <circle cx="290" cy="70" r="3"/><circle cx="330" cy="70" r="3"/><circle cx="370" cy="70" r="3"/>
  </g>

  <!-- Dish Illustration -->
  
        <ellipse cx="200" cy="165" rx="75" ry="20" fill="#9CA3AF" opacity="0.3"/>
        <path d="M135 135 C135 185 265 185 265 135 Z" fill="#DC2626" stroke="#B91C1C" stroke-width="3"/>
