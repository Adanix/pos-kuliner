<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bgGrad)"/>
  
  <!-- Subtle pattern dots -->
  <g opacity="0.07" fill="#14110F">
    <circle cx="30" cy="30" r="3"/><circle cx="70" cy="30" r="3"/><circle cx="110" cy="30" r="3"/>
    <circle cx="30" cy="70" r="3"/><circle cx="70" cy="70" r="3"/><circle cx="110" cy="70" r="3"/>
    <circle cx="290" cy="30" r="3"/><circle cx="330" cy="30" r="3"/><circle cx="370" cy="30" r="3"/>
    <circle cx="290" cy="70" r="3"/><circle cx="330" cy="70" r="3"/><circle cx="370" cy="70" r="3"/>
  </g>

  <!-- Dish Illustration -->
  
        <circle cx="200" cy="130" r="65" fill="#22C55E" opacity="0.15"/>
        <!-- Glass cup -->
        <path d="M165 85 L172 170 C173 175 178 180 185 180 L215 180 C222 180 227 175 228 170 L235 85 Z" fill="#FDE047" opacity="0.85" stroke="#86EFAC" stroke-width="3"/>
        <!-- Irisan Jeruk Nipis di bibir gelas -->
        <circle cx="165" cy="85" r="20" fill="#84CC16" stroke="#4D7C0F" stroke-width="3"/>
        <circle cx="165" cy="85" r="15" fill="#BEF264"/>
        <line x1="165" y1="70" x2="165" y2="100" stroke="#4D7C0F" stroke-width="2"/>
        <line x1="150" y1="85" x2="180" y2="85" stroke="#4D7C0F" stroke-width="2"/>
        <!-- Sedotan -->
        <line x1="215" y1="60" x2="195" y2="170" stroke="#15803D" stroke-width="5" stroke-linecap="round"/>
        <!-- Es batu -->
        <rect x="182" y="115" width="18" height="18" rx="4" fill="#FFFFFF" opacity="0.8" transform="rotate(12 191 124)"/>
        

  <!-- Badge Label -->
  <g transform="translate(20, 20)">
    <rect width="110" height="22" rx="11" fill="#16A34A"/>
    <text x="55" y="15" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">VITAMIN C ALAMI</text>
  </g>

  <!-- Bottom Info Card Overlay -->
  <rect x="0" y="205" width="400" height="75" fill="#14110F" opacity="0.9"/>
  <text x="20" y="235" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Es Jeruk Nipis</text>
  <text x="20" y="258" font-family="sans-serif" font-size="12" fill="#E7E0D6">Madu Segar Peras</text>
</svg>