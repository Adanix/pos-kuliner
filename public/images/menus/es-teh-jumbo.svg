<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bgGrad)"/>
  
  <!-- Subtle pattern dots -->
  <g opacity="0.07" fill="#14110F">
    <circle cx="30" cy="30" r="3"/><circle cx="70" cy="30" r="3"/><circle cx="110" cy="30" r="3"/>
    <circle cx="30" cy="70" r="3"/><circle cx="70" cy="70" r="3"/><circle cx="110" cy="70" r="3"/>
    <circle cx="290" cy="30" r="3"/><circle cx="330" cy="30" r="3"/><circle cx="370" cy="30" r="3"/>
    <circle cx="290" cy="70" r="3"/><circle cx="330" cy="70" r="3"/><circle cx="370" cy="70" r="3"/>
  </g>

  <!-- Dish Illustration -->
  
        <circle cx="200" cy="130" r="65" fill="#3B82F6" opacity="0.15"/>
        <!-- Glass cup -->
        <path d="M165 85 L172 170 C173 175 178 180 185 180 L215 180 C222 180 227 175 228 170 L235 85 Z" fill="#D97706" opacity="0.85" stroke="#93C5FD" stroke-width="3"/>
        <!-- Es batu -->
        <rect x="180" y="105" width="18" height="18" rx="4" fill="#FFFFFF" opacity="0.75" transform="rotate(15 189 114)"/>
        <rect x="200" y="120" width="18" height="18" rx="4" fill="#FFFFFF" opacity="0.75" transform="rotate(-10 209 129)"/>
        <!-- Sedotan -->
        <line x1="185" y1="60" x2="210" y2="170" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
        <!-- Daun Mint -->
        <ellipse cx="168" cy="82" rx="10" ry="6" fill="#16A34A" transform="rotate(-30 168 82)"/>
        

  <!-- Badge Label -->
  <g transform="translate(20, 20)">
    <rect width="110" height="22" rx="11" fill="#2563EB"/>
    <text x="55" y="15" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">SEGAR & DINGIN</text>
  </g>

  <!-- Bottom Info Card Overlay -->
  <rect x="0" y="205" width="400" height="75" fill="#14110F" opacity="0.9"/>
  <text x="20" y="235" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Es Teh Manis</text>
  <text x="20" y="258" font-family="sans-serif" font-size="12" fill="#E7E0D6">Porsi Jumbo Segar</text>
