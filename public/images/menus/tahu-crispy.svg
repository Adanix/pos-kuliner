    <circle cx="30" cy="70" r="3"/><circle cx="70" cy="70" r="3"/><circle cx="110" cy="70" r="3"/>
    <circle cx="290" cy="30" r="3"/><circle cx="330" cy="30" r="3"/><circle cx="370" cy="30" r="3"/>
    <circle cx="290" cy="70" r="3"/><circle cx="330" cy="70" r="3"/><circle cx="370" cy="70" r="3"/>
  </g>

  <!-- Dish Illustration -->
  
        <circle cx="200" cy="130" r="65" fill="#16A34A" opacity="0.15"/>
        <rect x="155" y="110" width="40" height="40" rx="8" fill="#FDE047" stroke="#CA8A04" stroke-width="2"/>
        <rect x="195" y="120" width="42" height="42" rx="8" fill="#EAB308" stroke="#A16207" stroke-width="2"/>
        <rect x="175" y="90" width="38" height="38" rx="8" fill="#FACC15" stroke="#CA8A04" stroke-width="2"/>
        <!-- Taburan cabe garam -->
        <circle cx="190" cy="105" r="3" fill="#DC2626"/>
        <circle cx="205" cy="112" r="3" fill="#16A34A"/>
        <circle cx="170" cy="125" r="3" fill="#DC2626"/>
        <circle cx="220" cy="140" r="3" fill="#DC2626"/>
        <circle cx="210" cy="130" r="2" fill="#FFFFFF"/>
        <circle cx="185" cy="118" r="2" fill="#FFFFFF"/>
        

  <!-- Badge Label -->
  <g transform="translate(20, 20)">
    <rect width="110" height="22" rx="11" fill="#15803D"/>
    <text x="55" y="15" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">CEMILAN KRISPI</text>
