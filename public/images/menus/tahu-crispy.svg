      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bgGrad)"/>
  
  <!-- Subtle pattern dots -->
  <g opacity="0.07" fill="#14110F">
