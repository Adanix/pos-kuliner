    <circle cx="290" cy="30" r="3"/><circle cx="330" cy="30" r="3"/><circle cx="370" cy="30" r="3"/>
    <circle cx="290" cy="70" r="3"/><circle cx="330" cy="70" r="3"/><circle cx="370" cy="70" r="3"/>
  </g>

  <!-- Dish Illustration -->
  
        <circle cx="200" cy="130" r="65" fill="#EAB308" opacity="0.15"/>
        <g transform="rotate(-15 170 120)">
            <rect x="140" y="90" width="55" height="75" rx="8" fill="#FDE047" stroke="#CA8A04" stroke-width="2"/>
