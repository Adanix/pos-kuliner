        <!-- Sambal kecap cup -->
        <ellipse cx="200" cy="165" rx="22" ry="9" fill="#1F2937"/>
        <circle cx="200" cy="164" r="3" fill="#DC2626"/>
        

  <!-- Badge Label -->
  <g transform="translate(20, 20)">
