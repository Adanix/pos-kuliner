<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bgGrad)"/>
  
  <!-- Subtle pattern dots -->
  <g opacity="0.07" fill="#14110F">
    <circle cx="30" cy="30" r="3"/><circle cx="70" cy="30" r="3"/><circle cx="110" cy="30" r="3"/>
    <circle cx="30" cy="70" r="3"/><circle cx="70" cy="70" r="3"/><circle cx="110" cy="70" r="3"/>
    <circle cx="290" cy="30" r="3"/><circle cx="330" cy="30" r="3"/><circle cx="370" cy="30" r="3"/>
    <circle cx="290" cy="70" r="3"/><circle cx="330" cy="70" r="3"/><circle cx="370" cy="70" r="3"/>
  </g>

  <!-- Dish Illustration -->
  
        <circle cx="200" cy="130" r="65" fill="#D97706" opacity="0.15"/>
        <!-- Bento Box -->
        <rect x="135" y="90" width="130" height="85" rx="10" fill="#1F2937" stroke="#374151" stroke-width="2"/>
        <!-- Nasi Putih -->
        <path d="M145 165 L175 110 L200 165 Z" fill="#FFFFFF" rx="4"/>
        <!-- Bebek Krispi -->
        <ellipse cx="230" cy="135" rx="26" ry="20" fill="#92400E"/>
        <!-- Sambal korek -->
        <circle cx="195" cy="120" r="8" fill="#DC2626"/>
        <!-- Gelas Es Jeruk Nipis mini -->
        <path d="M245 70 L250 105 L265 105 L270 70 Z" fill="#FDE047" opacity="0.9"/>
        <circle cx="246" cy="72" r="6" fill="#84CC16"/>
        <line x1="258" y1="60" x2="256" y2="100" stroke="#15803D" stroke-width="3"/>
        

  <!-- Badge Label -->
  <g transform="translate(20, 20)">
    <rect width="110" height="22" rx="11" fill="#B45309"/>
    <text x="55" y="15" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">PAKET SPESIAL</text>
  </g>

  <!-- Bottom Info Card Overlay -->
  <rect x="0" y="205" width="400" height="75" fill="#14110F" opacity="0.9"/>
  <text x="20" y="235" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Paket Bebek Gurih</text>
  <text x="20" y="258" font-family="sans-serif" font-size="12" fill="#E7E0D6">Bebek + Nasi + Es Jeruk</text>
</svg>